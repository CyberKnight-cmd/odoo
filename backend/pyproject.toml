[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arya Gupta", email = "aryagupta164@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncmy>=0.2.13",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "h3>=4.5.0",
    "polyline>=2.0.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
